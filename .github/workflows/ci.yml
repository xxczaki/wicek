name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
      - run: biome ci ./src

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  broker:
    name: Broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"
      - run: pip install mitmproxy==12.2.3 pytest ruff
      - run: ruff format --check broker && ruff check broker
      - run: pytest broker

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, broker]
    permissions:
      contents: read
      packages: write
    name: Build and deploy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract broker metadata
        id: brokerMeta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek-broker
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push broker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: broker
          push: true
          platforms: linux/arm64
          tags: ${{ steps.brokerMeta.outputs.tags }}
          annotations: ${{ steps.brokerMeta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract chromium metadata
        id: chromiumMeta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek-chromium
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push chromium
        uses: docker/build-push-action@v7
        with:
          context: .
          target: chromium
          push: true
          platforms: linux/arm64
          tags: ${{ steps.chromiumMeta.outputs.tags }}
          annotations: ${{ steps.chromiumMeta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Checkout homelab repo
        uses: actions/checkout@v7
        with:
          repository: xxczaki/homelab
          token: ${{ secrets.GH_PAT }}
          path: homelab
      - name: Install yq
        run: command -v yq || sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_arm64 && sudo chmod +x /usr/local/bin/yq
      - name: Deploy to homelab
        working-directory: homelab
        env:
          SHA: ${{ github.sha }}
          APP_FILE: apps/wicek/chart.yaml
        run: |
          if [ "$(yq 'select(.kind == "Application") | .spec.source.path' "$APP_FILE")" != "deploy/chart" ]; then
            echo "::notice::$APP_FILE does not deploy from this repo yet, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            yq -i '(select(.kind == "Application") | .spec.source.targetRevision) = strenv(SHA) | (select(.kind == "Application") | .spec.source.helm.valuesObject.image.tag) = strenv(SHA)' "$APP_FILE"
            git commit --quiet -am "chore(wicek): deploy ${SHA:0:7}" || exit 0
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --hard origin/main
            sleep $((attempt * 5))
          done
          exit 1
