name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@v2
      - run: biome ci ./src

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  broker:
    name: Broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
      - run: pip install mitmproxy==12.2.3 pytest ruff
      - run: ruff format --check broker && ruff check broker
      - run: pytest broker

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, broker]
    permissions:
      contents: read
      packages: write
    name: Build and deploy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract broker metadata
        id: brokerMeta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek-broker
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push broker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: broker
          push: true
          platforms: linux/arm64
          tags: ${{ steps.brokerMeta.outputs.tags }}
          annotations: ${{ steps.brokerMeta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract chromium metadata
        id: chromiumMeta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xxczaki/wicek-chromium
          flavor: |
            latest=true
          tags: |
            type=sha,prefix=,format=long
      - name: Build and push chromium
        uses: docker/build-push-action@v7
        with:
          context: .
          target: chromium
          push: true
          platforms: linux/arm64
          tags: ${{ steps.chromiumMeta.outputs.tags }}
          annotations: ${{ steps.chromiumMeta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: homelab
          permission-contents: write
      - name: Checkout homelab repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xxczaki/homelab
          persist-credentials: false
          path: homelab
      - name: Check deploy source
        id: source
        working-directory: homelab
        env:
          APP_FILE: apps/wicek/chart.yaml
        run: |
          if [ "$(yq 'select(.kind == "Application") | .spec.source.path' "$APP_FILE")" != "deploy/chart" ]; then
            echo "::notice::$APP_FILE does not deploy from this repo yet, skipping"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to homelab
        if: steps.source.outputs.enabled == 'true'
        uses: xxczaki/actions/commit-via-api@2055f70b487aac8d86315ce4eb26028931f60cd6 # v1.0.0
        env:
          SHA: ${{ github.sha }}
          APP_FILE: apps/wicek/chart.yaml
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: xxczaki/homelab
          branch: main
          working-directory: homelab
          message: "chore(wicek): deploy ${{ github.sha }}"
          apply: |
            yq -i '(select(.kind == "Application") | .spec.source.targetRevision) = strenv(SHA) | (select(.kind == "Application") | .spec.source.helm.valuesObject.image.tag) = strenv(SHA)' "$APP_FILE"
            git add "$APP_FILE"
